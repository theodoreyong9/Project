<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>Trio Viewer</title>
<meta name="theme-color" content="#0d1117" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<style>
  :root{
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    /* Hauteur de la bande dédiée au swipe (ne recouvre JAMAIS l'iframe) */
    --swipe-h: 26px;
  }
  *{box-sizing: inherit;}
  html, body{
    margin:0;
    height:100%;
    width:100%;
    overflow:hidden;
    background:#0d1117;
  }
  #stage{
    position:fixed;
    top:0;
    left:0;
    right:0;
    /* La zone de swipe a sa propre bande en dessous, donc le stage
       s'arrête AVANT elle : aucun recouvrement avec les iframes. */
    bottom: calc(var(--swipe-h) + env(safe-area-inset-bottom, 0px));
    overflow:hidden;
  }
  #track{
    display:flex;
    height:100%;
    width:300%; /* 3 slides = gauche / centre (actif) / droite */
  }
  .slide{
    width:33.3333%;
    height:100%;
  }
  .slide iframe{
    width:100%;
    height:100%;
    border:0;
    display:block;
    background:#0d1117;
  }
  /* Indicateur animé, dans la bande de swipe elle-même : montre le
     swipe bidirectionnel en boucle avec un mouvement stylé continu. */
  #swipeHint{
    position:fixed;
    bottom: env(safe-area-inset-bottom, 0px);
    left:0;
    right:0;
    height: var(--swipe-h);
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    z-index:999;
    pointer-events:none;
    opacity:1;
    transition: opacity .5s ease;
  }
  #swipeHint.dim{ opacity:0.28; }
  #swipeHint.active .runner{
    box-shadow: 0 0 8px 2px rgba(88,166,255,0.7);
  }

  .chevron{
    font-size:11px;
    line-height:1;
    color:#8b949e;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  .chevron-left{ animation: chevronLeftPulse 2.4s ease-in-out infinite; }
  .chevron-right{ animation: chevronRightPulse 2.4s ease-in-out infinite; animation-delay: 1.2s; }
  @keyframes chevronLeftPulse{
    0%, 100% { opacity:.25; transform: translateX(0); }
    50%      { opacity:.9;  transform: translateX(-3px); }
  }
  @keyframes chevronRightPulse{
    0%, 100% { opacity:.25; transform: translateX(0); }
    50%      { opacity:.9;  transform: translateX(3px); }
  }

  .dots-track{
    position:relative;
    width:40px;
    height:5px;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .dots-track .dot{
    width:5px;
    height:5px;
    border-radius:50%;
    background:#8b949e;
    opacity:.5;
  }
  .dots-track .dot.active{
    opacity:1;
    background:#c9d1d9;
  }
  .runner{
    position:absolute;
    top:50%;
    left:0%;
    width:8px;
    height:8px;
    margin-left:-4px;
    border-radius:50%;
    background: linear-gradient(135deg,#58a6ff,#3fb950 50%,#f778ba);
    transform: translateY(-50%);
    transition: left .32s cubic-bezier(.4,0,.2,1), box-shadow .3s ease;
    animation: runnerBreathe 2.4s ease-in-out infinite;
  }
  @keyframes runnerBreathe{
    0%, 100% { filter: brightness(1);   transform: translateY(-50%) scale(1); }
    50%      { filter: brightness(1.35);transform: translateY(-50%) scale(1.15); }
  }

  /* Zone de swipe : bande dédiée sous les iframes, ne recouvre rien de
     cliquable. Elle ne touche donc jamais au contenu des 3 sites. */
  #swipeZone{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    height: calc(var(--swipe-h) + env(safe-area-inset-bottom, 0px));
    z-index:1000;
    background:#0d1117; /* même couleur que le fond = quasi invisible */
    touch-action:none;
  }
</style>
</head>
<body>

<div id="stage">
  <div id="track">
    <div class="slide" data-real="2"><iframe title="page-2" loading="eager" src="about:blank"></iframe></div>
    <div class="slide" data-real="0"><iframe title="page-0" loading="eager" src="about:blank"></iframe></div>
    <div class="slide" data-real="1"><iframe title="page-1" loading="eager" src="about:blank"></iframe></div>
  </div>
</div>

<div id="swipeHint" aria-hidden="true">
  <span class="chevron chevron-left">‹</span>
  <span class="dots-track">
    <span class="dot" data-i="0"></span>
    <span class="dot" data-i="1"></span>
    <span class="dot" data-i="2"></span>
    <span class="runner"></span>
  </span>
  <span class="chevron chevron-right">›</span>
</div>

<!-- Zone de swipe invisible (capte les gestes, l'indicateur ci-dessus est purement visuel) -->
<div id="swipeZone"></div>

<script>
(function(){
  const PAGES = [
    "https://yourmine-dapp.web.app",
    "https://theodoreyong9.github.io/Aiwa_project",
    "https://theodoreyong9.github.io/Jobber"
  ];

  const track = document.getElementById("track");
  const slides = Array.from(track.children); // 3 slides, un par page réelle, jamais dupliqués
  const dots = Array.from(document.querySelectorAll(".dots-track .dot"));
  const runner = document.querySelector(".runner");
  const swipeHint = document.getElementById("swipeHint");
  const swipeZone = document.getElementById("swipeZone");
  const RUNNER_POS = ["0%", "50%", "100%"]; // position le long de la piste pour page 0/1/2

  // Chaque slide charge sa page UNE SEULE FOIS, pour de bon (pas de clone,
  // pas de rechargement lors de la boucle -> plus de flash / clignotement).
  slides.forEach(slide => {
    const real = parseInt(slide.dataset.real, 10);
    slide.querySelector("iframe").src = PAGES[real];
  });

  // layout[0]=page à gauche, layout[1]=page active (centre), layout[2]=page à droite
  let layout = [2, 0, 1];

  function applyLayout(){
    slides.forEach(slide => {
      const real = parseInt(slide.dataset.real, 10);
      slide.style.order = layout.indexOf(real);
    });
    updateDots();
  }

  function updateDots(){
    const real = layout[1];
    dots.forEach(d => d.classList.toggle("active", parseInt(d.dataset.i,10) === real));
    runner.style.left = RUNNER_POS[real];
  }

  let index = 1;          // position visuelle courante: 0=gauche,1=centre,2=droite
  let dragging = false;
  let startX = 0;
  let baseOffset = 0;
  let width = window.innerWidth;
  let activePointerId = null;

  function setTransform(px, withTransition){
    track.style.transition = withTransition ? "transform 0.32s ease" : "none";
    track.style.transform = `translateX(${px}px)`;
  }

  function offsetForIndex(i){
    return -i * width;
  }

  function goTo(i, animate){
    index = i;
    setTransform(offsetForIndex(index), animate);
  }

  track.addEventListener("transitionend", () => {
    if (index === 2) {
      // Swipe vers la page suivante : rotation, la page de gauche devient
      // automatiquement la nouvelle page de droite (aucune iframe rechargée).
      layout = [layout[1], layout[2], layout[0]];
      applyLayout();
      index = 1;
      setTransform(offsetForIndex(index), false);
    } else if (index === 0) {
      layout = [layout[2], layout[0], layout[1]];
      applyLayout();
      index = 1;
      setTransform(offsetForIndex(index), false);
    }
  });

  window.addEventListener("resize", () => {
    width = window.innerWidth;
    setTransform(offsetForIndex(index), false);
  });

  // Initialisation
  width = window.innerWidth;
  applyLayout();
  setTransform(offsetForIndex(index), false);

  // --- Indicateur animé : actif au démarrage, s'atténue après un délai,
  // se réveille brièvement à chaque interaction ---
  let dimTimer = null;
  let wakeTimer = null;

  function scheduleDim(delay){
    clearTimeout(dimTimer);
    dimTimer = setTimeout(() => swipeHint.classList.add("dim"), delay);
  }
  function wakeHint(){
    clearTimeout(wakeTimer);
    swipeHint.classList.remove("dim");
    swipeHint.classList.add("active");
  }
  function sleepHintSoon(){
    clearTimeout(wakeTimer);
    wakeTimer = setTimeout(() => {
      swipeHint.classList.remove("active");
      scheduleDim(1500);
    }, 400);
  }
  scheduleDim(3500);

  // --- Gestion du swipe : Pointer Events UNIQUEMENT (évite le conflit
  // touch+pointer qui rendait le geste erratique par moments) ---
  const THRESHOLD = 40; // px minimum pour valider un swipe

  function onStart(e){
    if (!e.isPrimary) return;
    if (activePointerId !== null) return;
    activePointerId = e.pointerId;
    dragging = true;
    startX = e.clientX;
    baseOffset = offsetForIndex(index);
    track.style.transition = "none";
    wakeHint();
    try { swipeZone.setPointerCapture(e.pointerId); } catch(_) {}
  }

  function onMove(e){
    if (!dragging || e.pointerId !== activePointerId) return;
    const delta = e.clientX - startX;
    setTransform(baseOffset + delta, false);
  }

  function endDrag(clientX){
    dragging = false;
    activePointerId = null;
    const delta = clientX - startX;
    if (Math.abs(delta) > THRESHOLD) {
      goTo(delta < 0 ? 2 : 0, true);
    } else {
      setTransform(offsetForIndex(index), true);
    }
    sleepHintSoon();
  }

  function onEnd(e){
    if (e.pointerId !== activePointerId) return;
    endDrag(e.clientX);
  }

  function onCancel(e){
    if (e.pointerId !== activePointerId) return;
    dragging = false;
    activePointerId = null;
    setTransform(offsetForIndex(index), true);
    sleepHintSoon();
  }

  swipeZone.addEventListener("pointerdown", onStart);
  swipeZone.addEventListener("pointermove", onMove);
  swipeZone.addEventListener("pointerup", onEnd);
  swipeZone.addEventListener("pointercancel", onCancel);
  swipeZone.addEventListener("lostpointercapture", (e) => {
    if (e.pointerId === activePointerId && dragging) onCancel(e);
  });

  // Service worker pour le côté PWA (mise en cache de la coquille uniquement)
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(()=>{});
    });
  }
})();
</script>
</body>
</html>
