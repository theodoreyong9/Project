<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>Trio Viewer</title>
<meta name="theme-color" content="#0d1117" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<style>
  :root{
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    /* Hauteur de la bande dédiée au swipe (ne recouvre JAMAIS l'iframe) */
    --swipe-h: 26px;
  }
  *{box-sizing: inherit;}
  html, body{
    margin:0;
    height:100%;
    width:100%;
    overflow:hidden;
    background:#0d1117;
  }
  #stage{
    position:fixed;
    top:0;
    left:0;
    right:0;
    /* La zone de swipe a sa propre bande en dessous, donc le stage
       s'arrête AVANT elle : aucun recouvrement avec les iframes. */
    bottom: calc(var(--swipe-h) + env(safe-area-inset-bottom, 0px));
    overflow:hidden;
  }
  #track{
    display:flex;
    height:100%;
    width:300%; /* 3 slides = gauche / centre (actif) / droite */
  }
  .slide{
    width:33.3333%;
    height:100%;
  }
  .slide iframe{
    width:100%;
    height:100%;
    border:0;
    display:block;
    background:#0d1117;
  }
  /* Indicateur animé, dans la bande de swipe elle-même : montre le
     swipe bidirectionnel en boucle avec un mouvement stylé continu. */
  #swipeHint{
    position:fixed;
    bottom: env(safe-area-inset-bottom, 0px);
    left:0;
    right:0;
    height: var(--swipe-h);
    display:flex;
    align-items:center;
    justify-content:center;
    gap:14px;
    z-index:999;
    pointer-events:none;
    opacity:0.85;
    transition: opacity .3s ease;
  }
  #swipeHint.active{ opacity:1; }

  .pulse-group{
    position:relative;
    width:28px;
    height:16px;
  }
  .pulse-arrow{
    position:absolute;
    top:50%;
    left:50%;
    font-size:14px;
    font-weight:bold;
    line-height:1;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    opacity:0;
  }
  .pulse-left .pulse-arrow{ color:#58a6ff; animation: pulseOutLeft 1.5s ease-out infinite; }
  .pulse-right .pulse-arrow{ color:#f778ba; animation: pulseOutRight 1.5s ease-out infinite; }
  .pulse-arrow:nth-child(1){ animation-delay: 0s; }
  .pulse-arrow:nth-child(2){ animation-delay: 0.3s; }
  .pulse-arrow:nth-child(3){ animation-delay: 0.6s; }
  @keyframes pulseOutLeft{
    0%   { opacity:0;   transform: translate(-50%,-50%) translateX(0) scale(0.8); }
    18%  { opacity:1;   transform: translate(-50%,-50%) translateX(-4px) scale(1); }
    100% { opacity:0;   transform: translate(-50%,-50%) translateX(-22px) scale(0.9); }
  }
  @keyframes pulseOutRight{
    0%   { opacity:0;   transform: translate(-50%,-50%) translateX(0) scale(0.8); }
    18%  { opacity:1;   transform: translate(-50%,-50%) translateX(4px) scale(1); }
    100% { opacity:0;   transform: translate(-50%,-50%) translateX(22px) scale(0.9); }
  }

  /* Zone de swipe : bande dédiée sous les iframes, ne recouvre rien de
     cliquable. Elle ne touche donc jamais au contenu des 3 sites. */
  #swipeZone{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    height: calc(var(--swipe-h) + env(safe-area-inset-bottom, 0px));
    z-index:1000;
    background:#0d1117; /* même couleur que le fond = quasi invisible */
    touch-action:none;
  }
</style>
</head>
<body>

<div id="stage">
  <div id="track">
    <div class="slide" data-real="2"><iframe title="page-2" loading="eager" src="about:blank"></iframe></div>
    <div class="slide" data-real="0"><iframe title="page-0" loading="eager" src="about:blank"></iframe></div>
    <div class="slide" data-real="1"><iframe title="page-1" loading="eager" src="about:blank"></iframe></div>
  </div>
</div>

<div id="swipeHint" aria-hidden="true">
  <div class="pulse-group pulse-left">
    <span class="pulse-arrow">‹</span>
    <span class="pulse-arrow">‹</span>
    <span class="pulse-arrow">‹</span>
  </div>
  <div class="pulse-group pulse-right">
    <span class="pulse-arrow">›</span>
    <span class="pulse-arrow">›</span>
    <span class="pulse-arrow">›</span>
  </div>
</div>

<!-- Zone de swipe invisible (capte les gestes, l'indicateur ci-dessus est purement visuel) -->
<div id="swipeZone"></div>

<script>
(function(){
  const PAGES = [
    "https://yourmine-dapp.web.app",
    "https://theodoreyong9.github.io/Aiwa_project",
    "https://theodoreyong9.github.io/Jobber"
  ];

  const track = document.getElementById("track");
  const slides = Array.from(track.children); // 3 slides, un par page réelle, jamais dupliqués
  const swipeHint = document.getElementById("swipeHint");
  const swipeZone = document.getElementById("swipeZone");

  // Chaque slide charge sa page UNE SEULE FOIS, pour de bon (pas de clone,
  // pas de rechargement lors de la boucle -> plus de flash / clignotement).
  slides.forEach(slide => {
    const real = parseInt(slide.dataset.real, 10);
    slide.querySelector("iframe").src = PAGES[real];
  });

  // layout[0]=page à gauche, layout[1]=page active (centre), layout[2]=page à droite
  let layout = [2, 0, 1];

  function applyLayout(){
    slides.forEach(slide => {
      const real = parseInt(slide.dataset.real, 10);
      slide.style.order = layout.indexOf(real);
    });
  }

  let index = 1;          // position visuelle courante: 0=gauche,1=centre,2=droite
  let dragging = false;
  let startX = 0;
  let baseOffset = 0;
  let width = window.innerWidth;
  let activePointerId = null;
  let animating = false;  // vrai pendant l'animation d'un swipe validé

  function setTransform(px, withTransition){
    track.style.transition = withTransition ? "transform 0.32s ease" : "none";
    track.style.transform = `translateX(${px}px)`;
  }

  function offsetForIndex(i){
    return -i * width;
  }

  function goTo(i, animate){
    index = i;
    if (animate) animating = true;
    setTransform(offsetForIndex(index), animate);
  }

  function settleInstantly(){
    // Termine immédiatement la rotation en cours (sans attendre la fin de
    // l'animation CSS) pour repartir d'un état stable et cohérent.
    if (index === 2) {
      layout = [layout[1], layout[2], layout[0]];
      applyLayout();
    } else if (index === 0) {
      layout = [layout[2], layout[0], layout[1]];
      applyLayout();
    }
    index = 1;
    animating = false;
    setTransform(offsetForIndex(index), false);
  }

  track.addEventListener("transitionend", (e) => {
    if (e.target !== track || e.propertyName !== "transform") return;
    if (animating) settleInstantly();
  });

  window.addEventListener("resize", () => {
    width = window.innerWidth;
    setTransform(offsetForIndex(index), false);
  });

  // Initialisation
  width = window.innerWidth;
  applyLayout();
  setTransform(offsetForIndex(index), false);

  // --- Indicateur : toujours visible, léger boost d'opacité au toucher ---
  let wakeTimer = null;

  function wakeHint(){
    clearTimeout(wakeTimer);
    swipeHint.classList.add("active");
  }
  function sleepHintSoon(){
    clearTimeout(wakeTimer);
    wakeTimer = setTimeout(() => swipeHint.classList.remove("active"), 400);
  }

  // --- Gestion du swipe : Pointer Events UNIQUEMENT (évite le conflit
  // touch+pointer qui rendait le geste erratique par moments) ---
  const THRESHOLD = 40; // px minimum pour valider un swipe

  function onStart(e){
    if (!e.isPrimary) return;
    if (activePointerId !== null) return;
    if (animating) settleInstantly(); // évite toute course avec une animation en cours
    activePointerId = e.pointerId;
    dragging = true;
    startX = e.clientX;
    baseOffset = offsetForIndex(index);
    track.style.transition = "none";
    wakeHint();
    try { swipeZone.setPointerCapture(e.pointerId); } catch(_) {}
  }

  function onMove(e){
    if (!dragging || e.pointerId !== activePointerId) return;
    const delta = e.clientX - startX;
    setTransform(baseOffset + delta, false);
  }

  function endDrag(clientX){
    dragging = false;
    activePointerId = null;
    const delta = clientX - startX;
    if (Math.abs(delta) > THRESHOLD) {
      goTo(delta < 0 ? 2 : 0, true);
    } else {
      setTransform(offsetForIndex(index), true);
    }
    sleepHintSoon();
  }

  function onEnd(e){
    if (e.pointerId !== activePointerId) return;
    endDrag(e.clientX);
  }

  function onCancel(e){
    if (e.pointerId !== activePointerId) return;
    dragging = false;
    activePointerId = null;
    setTransform(offsetForIndex(index), true);
    sleepHintSoon();
  }

  swipeZone.addEventListener("pointerdown", onStart);
  swipeZone.addEventListener("pointermove", onMove);
  swipeZone.addEventListener("pointerup", onEnd);
  swipeZone.addEventListener("pointercancel", onCancel);
  swipeZone.addEventListener("lostpointercapture", (e) => {
    if (e.pointerId === activePointerId && dragging) onCancel(e);
  });

  // Service worker pour le côté PWA (mise en cache de la coquille uniquement)
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(()=>{});
    });
  }
})();
</script>
</body>
</html>
