<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>Trio Viewer</title>
<meta name="theme-color" content="#0d1117" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<style>
  :root{
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    /* Hauteur de la bande dédiée au swipe (ne recouvre JAMAIS l'iframe) */
    --swipe-h: 26px;
  }
  *{box-sizing: inherit;}
  html, body{
    margin:0;
    height:100%;
    width:100%;
    overflow:hidden;
    background:#0d1117;
  }
  #stage{
    position:fixed;
    top:0;
    left:0;
    right:0;
    bottom: calc(var(--swipe-h) + env(safe-area-inset-bottom, 0px));
    overflow:hidden;
  }
  #track{
    display:flex;
    height:100%;
    width:300%;
  }
  .slide{
    width:33.3333%;
    height:100%;
  }
  .slide iframe{
    width:100%;
    height:100%;
    border:0;
    display:block;
    background:#0d1117;
  }

  /* Indicateur visuel : flèches qui partent du centre et filent vers
     l'extérieur en boucle des deux côtés. Purement décoratif. */
  #swipeHint{
    position:fixed;
    bottom: env(safe-area-inset-bottom, 0px);
    left:0;
    right:0;
    height: var(--swipe-h);
    display:flex;
    align-items:center;
    justify-content:center;
    gap:14px;
    z-index:1001;
    pointer-events:none;
    opacity:0.85;
    transition: opacity .3s ease;
  }
  #swipeHint.active{ opacity:1; }
  .pulse-group{ position:relative; width:28px; height:16px; }
  .pulse-arrow{
    position:absolute;
    top:50%;
    left:50%;
    font-size:14px;
    font-weight:bold;
    line-height:1;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    opacity:0;
  }
  .pulse-left .pulse-arrow{ color:#58a6ff; animation: pulseOutLeft 1.5s ease-out infinite; }
  .pulse-right .pulse-arrow{ color:#f778ba; animation: pulseOutRight 1.5s ease-out infinite; }
  .pulse-arrow:nth-child(1){ animation-delay: 0s; }
  .pulse-arrow:nth-child(2){ animation-delay: 0.3s; }
  .pulse-arrow:nth-child(3){ animation-delay: 0.6s; }
  @keyframes pulseOutLeft{
    0%   { opacity:0; transform: translate(-50%,-50%) translateX(0) scale(0.8); }
    18%  { opacity:1; transform: translate(-50%,-50%) translateX(-4px) scale(1); }
    100% { opacity:0; transform: translate(-50%,-50%) translateX(-22px) scale(0.9); }
  }
  @keyframes pulseOutRight{
    0%   { opacity:0; transform: translate(-50%,-50%) translateX(0) scale(0.8); }
    18%  { opacity:1; transform: translate(-50%,-50%) translateX(4px) scale(1); }
    100% { opacity:0; transform: translate(-50%,-50%) translateX(22px) scale(0.9); }
  }

  /* Zone de swipe : défilement NATIF avec snap, géré par le compositeur du
     navigateur plutôt que par du JS pointerdown/pointermove/pointerup.
     Beaucoup plus résistant si un site embarqué sature le thread principal
     (ex: rendu 3D continu). Ne recouvre jamais les iframes (bande dédiée). */
  #swipeZone{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    height: calc(var(--swipe-h) + env(safe-area-inset-bottom, 0px));
    z-index:1000;
    overflow-x:scroll;
    overflow-y:hidden;
    scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch;
    scrollbar-width:none;
    background:transparent;
  }
  #swipeZone::-webkit-scrollbar{ display:none; }
  #swipeScrollTrack{
    display:flex;
    width:300%;
    height:100%;
  }
  #swipeScrollTrack .snap-slot{
    width:33.3333%;
    height:100%;
    flex-shrink:0;
    scroll-snap-align:center;
  }
</style>
</head>
<body>

<div id="stage">
  <div id="track">
    <div class="slide" data-real="2"><iframe title="page-2" loading="eager" allow="geolocation; camera; microphone; clipboard-write" src="about:blank"></iframe></div>
    <div class="slide" data-real="0"><iframe title="page-0" loading="eager" allow="geolocation; camera; microphone; clipboard-write" src="about:blank"></iframe></div>
    <div class="slide" data-real="1"><iframe title="page-1" loading="eager" allow="geolocation; camera; microphone; clipboard-write" src="about:blank"></iframe></div>
  </div>
</div>

<div id="swipeHint" aria-hidden="true">
  <div class="pulse-group pulse-left">
    <span class="pulse-arrow">‹</span>
    <span class="pulse-arrow">‹</span>
    <span class="pulse-arrow">‹</span>
  </div>
  <div class="pulse-group pulse-right">
    <span class="pulse-arrow">›</span>
    <span class="pulse-arrow">›</span>
    <span class="pulse-arrow">›</span>
  </div>
</div>

<!-- Zone de swipe : défilement natif avec snap, invisible -->
<div id="swipeZone">
  <div id="swipeScrollTrack">
    <div class="snap-slot"></div>
    <div class="snap-slot"></div>
    <div class="snap-slot"></div>
  </div>
</div>

<script>
(function(){
  const PAGES = [
    "https://yourmine-dapp.web.app",
    "https://theodoreyong9.github.io/Aiwa_project",
    "https://theodoreyong9.github.io/Jobber"
  ];

  const track = document.getElementById("track");
  const slides = Array.from(track.children);
  const swipeHint = document.getElementById("swipeHint");
  const swipeZone = document.getElementById("swipeZone");

  slides.forEach(slide => {
    const real = parseInt(slide.dataset.real, 10);
    slide.querySelector("iframe").src = PAGES[real];
  });

  // layout[0]=page à gauche, layout[1]=page active (centre), layout[2]=page à droite
  let layout = [2, 0, 1];

  function applyLayout(){
    slides.forEach(slide => {
      const real = parseInt(slide.dataset.real, 10);
      slide.style.order = layout.indexOf(real);
    });
  }

  let width = window.innerWidth;

  function setTransform(px){
    track.style.transform = `translateX(${px}px)`;
  }

  function offsetForFraction(frac){
    return -frac * width;
  }

  function resetToCenter(){
    // Recentre instantanément la zone de scroll ET le carrousel visuel,
    // sans aucune animation CSS ni dépendance à un événement pointer.
    swipeZone.scrollLeft = swipeZone.clientWidth;
    setTransform(offsetForFraction(1));
  }

  // --- Suivi live du scroll natif (rAF-throttled) ---
  let rafPending = false;
  function onScroll(){
    wakeHint();
    if (rafPending) { scheduleSettleCheck(); return; }
    rafPending = true;
    requestAnimationFrame(() => {
      rafPending = false;
      const frac = swipeZone.scrollLeft / swipeZone.clientWidth; // ~0..2
      setTransform(offsetForFraction(frac));
    });
    scheduleSettleCheck();
  }

  // --- Détection de fin de geste : natif quand disponible, sinon debounce ---
  let settleTimer = null;
  function scheduleSettleCheck(){
    clearTimeout(settleTimer);
    settleTimer = setTimeout(onSettled, 120);
  }

  function onSettled(){
    const frac = swipeZone.scrollLeft / swipeZone.clientWidth;
    const snapped = Math.round(frac); // 0, 1 ou 2
    if (snapped === 2) {
      layout = [layout[1], layout[2], layout[0]];
      applyLayout();
    } else if (snapped === 0) {
      layout = [layout[2], layout[0], layout[1]];
      applyLayout();
    }
    resetToCenter();
    sleepHintSoon();
  }

  swipeZone.addEventListener("scroll", onScroll, { passive:true });
  if ("onscrollend" in window) {
    swipeZone.addEventListener("scrollend", onSettled);
  }

  window.addEventListener("resize", () => {
    width = window.innerWidth;
    resetToCenter();
  });

  // Initialisation
  width = window.innerWidth;
  applyLayout();
  resetToCenter();

  // --- Indicateur : toujours visible, léger boost d'opacité au toucher ---
  let wakeTimer = null;
  function wakeHint(){
    clearTimeout(wakeTimer);
    swipeHint.classList.add("active");
  }
  function sleepHintSoon(){
    clearTimeout(wakeTimer);
    wakeTimer = setTimeout(() => swipeHint.classList.remove("active"), 400);
  }

  // Service worker pour le côté PWA (mise en cache de la coquille uniquement)
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(()=>{});
    });
  }
})();
</script>
</body>
</html>
