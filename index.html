<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>Trio Viewer</title>
<meta name="theme-color" content="#0d1117" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<style>
  :root{
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing: inherit;}
  html, body{
    margin:0;
    height:100%;
    width:100%;
    overflow:hidden;
    background:#0d1117;
  }
  :root{
    /* Hauteur de la bande dédiée au swipe (ne recouvre JAMAIS l'iframe) */
    --swipe-h: 26px;
  }
  #stage{
    position:fixed;
    top:0;
    left:0;
    right:0;
    /* La zone de swipe a sa propre bande en dessous, donc le stage
       s'arrête AVANT elle : aucun recouvrement avec les iframes. */
    bottom: calc(var(--swipe-h) + env(safe-area-inset-bottom, 0px));
    overflow:hidden;
  }
  #track{
    display:flex;
    height:100%;
    /* 5 slides = clone(last) + 3 pages + clone(first) */
    width:500%;
  }
  .slide{
    width:20%;
    height:100%;
  }
  .slide iframe{
    width:100%;
    height:100%;
    border:0;
    display:block;
    background:#0d1117;
  }
  /* Zone de swipe : bande dédiée sous les iframes, ne recouvre rien de
     cliquable. Elle ne touche donc jamais au contenu des 3 sites. */
  #swipeZone{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    height: calc(var(--swipe-h) + env(safe-area-inset-bottom, 0px));
    z-index:1000;
    background:#0d1117; /* même couleur que le fond = quasi invisible */
    touch-action:none;
  }
  /* Petits points indicateurs discrets, dans la bande de swipe elle-même */
  #dots{
    position:fixed;
    bottom: env(safe-area-inset-bottom, 0px);
    left:0;
    right:0;
    height: var(--swipe-h);
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    z-index:999;
    pointer-events:none;
    opacity:0.35;
  }
  #dots span{
    width:6px;
    height:6px;
    border-radius:50%;
    background:#8b949e;
  }
  #dots span.active{
    background:#58a6ff;
  }
</style>
</head>
<body>

<div id="stage">
  <div id="track">
    <div class="slide" data-real="2"><iframe title="clone-2" loading="lazy" src="about:blank"></iframe></div>
    <div class="slide" data-real="0"><iframe title="page-0" loading="lazy" src="about:blank"></iframe></div>
    <div class="slide" data-real="1"><iframe title="page-1" loading="lazy" src="about:blank"></iframe></div>
    <div class="slide" data-real="2"><iframe title="page-2" loading="lazy" src="about:blank"></iframe></div>
    <div class="slide" data-real="0"><iframe title="clone-0" loading="lazy" src="about:blank"></iframe></div>
  </div>
</div>

<div id="dots">
  <span data-i="0"></span>
  <span data-i="1"></span>
  <span data-i="2"></span>
</div>

<!-- Zone de swipe invisible -->
<div id="swipeZone"></div>

<script>
(function(){
  const PAGES = [
    "https://yourmine-dapp.web.app",
    "https://theodoreyong9.github.io/Aiwa_project",
    "https://theodoreyong9.github.io/Jobber"
  ];

  const track = document.getElementById("track");
  const slides = Array.from(track.children); // 5 slides
  const dots = Array.from(document.querySelectorAll("#dots span"));
  const swipeZone = document.getElementById("swipeZone");

  // Charge chaque iframe une seule fois (lazy) avec son URL réelle
  slides.forEach(slide => {
    const real = parseInt(slide.dataset.real, 10);
    const iframe = slide.querySelector("iframe");
    iframe.dataset.src = PAGES[real];
  });

  function loadIframeIfNeeded(index){
    const slide = slides[index];
    const iframe = slide.querySelector("iframe");
    if (iframe.src === "about:blank" || !iframe.src) {
      iframe.src = iframe.dataset.src;
    }
  }

  let index = 1;        // position dans le tableau des 5 slides (1 = vraie page 0)
  let dragging = false;
  let startX = 0;
  let currentX = 0;
  let baseOffset = 0;
  let width = window.innerWidth;
  let animating = false;

  function slidePercentWidth(){ return 20; } // chaque slide = 20% du track (5 slides)

  function setTransform(px, withTransition){
    track.style.transition = withTransition ? "transform 0.32s ease" : "none";
    track.style.transform = `translateX(${px}px)`;
  }

  function offsetForIndex(i){
    return -i * width;
  }

  function updateDots(){
    const real = parseInt(slides[index].dataset.real, 10);
    dots.forEach(d => d.classList.toggle("active", parseInt(d.dataset.i,10) === real));
  }

  function goTo(i, animate){
    index = i;
    setTransform(offsetForIndex(index), animate);
    loadIframeIfNeeded(index);
    updateDots();
  }

  function next(){
    if (animating) return;
    animating = true;
    goTo(index + 1, true);
  }

  function prev(){
    if (animating) return;
    animating = true;
    goTo(index - 1, true);
  }

  track.addEventListener("transitionend", () => {
    animating = false;
    // Boucle infinie : si on est sur un clone, on saute sans animation vers l'original
    if (index === 4) { // clone(0) après page 2
      index = 1;
      setTransform(offsetForIndex(index), false);
      loadIframeIfNeeded(index);
      updateDots();
    } else if (index === 0) { // clone(2) avant page 0
      index = 3;
      setTransform(offsetForIndex(index), false);
      loadIframeIfNeeded(index);
      updateDots();
    }
  });

  window.addEventListener("resize", () => {
    width = window.innerWidth;
    setTransform(offsetForIndex(index), false);
  });

  // Initialisation
  width = window.innerWidth;
  setTransform(offsetForIndex(index), false);
  loadIframeIfNeeded(index);
  updateDots();
  // Précharge aussi les voisins pour un swipe plus fluide
  loadIframeIfNeeded(index - 1);
  loadIframeIfNeeded(index + 1);

  // --- Gestion du swipe dans la zone invisible ---
  const THRESHOLD = 40; // px minimum pour valider un swipe

  function onStart(x){
    dragging = true;
    animating = false;
    startX = x;
    baseOffset = offsetForIndex(index);
    track.style.transition = "none";
  }

  function onMove(x){
    if (!dragging) return;
    currentX = x;
    const delta = currentX - startX;
    setTransform(baseOffset + delta, false);
  }

  function onEnd(x){
    if (!dragging) return;
    dragging = false;
    const delta = x - startX;
    if (Math.abs(delta) > THRESHOLD) {
      animating = true;
      if (delta < 0) {
        goTo(index + 1, true);
      } else {
        goTo(index - 1, true);
      }
    } else {
      // Retour à la position actuelle
      setTransform(offsetForIndex(index), true);
    }
  }

  swipeZone.addEventListener("touchstart", e => onStart(e.touches[0].clientX), {passive:true});
  swipeZone.addEventListener("touchmove", e => onMove(e.touches[0].clientX), {passive:true});
  swipeZone.addEventListener("touchend", e => onEnd(e.changedTouches[0].clientX), {passive:true});

  swipeZone.addEventListener("pointerdown", e => { onStart(e.clientX); swipeZone.setPointerCapture(e.pointerId); });
  swipeZone.addEventListener("pointermove", e => onMove(e.clientX));
  swipeZone.addEventListener("pointerup", e => onEnd(e.clientX));
  swipeZone.addEventListener("pointercancel", e => onEnd(startX));

  // Service worker pour le côté PWA (mise en cache de la coquille uniquement)
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(()=>{});
    });
  }
})();
</script>
</body>
</html>
